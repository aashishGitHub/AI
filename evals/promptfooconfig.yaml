# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: "Ask AI-style RAG answer eval — first golden set"

providers:
  - id: ollama:chat:llama3.2:1b

prompts:
  - file://prompts/answer.txt

defaultTest:
  options:
    provider:
      id: ollama:chat:qwen2.5:1.5b # judge — different model than the one under test
      config:
        passthrough:
          format: json # force raw JSON output, no markdown fencing

tests:
  - description: "primary index creation (happy path)"
    vars:
      question: "How do I create a primary index in Capella?"
      context: file://golden/contexts/primary-index.md
    assert:
      - type: contains # deterministic, runs first, cheap
        value: "CREATE PRIMARY INDEX"
      - type: g-eval # model-graded, judged by qwen2.5:1.5b
        value: "Answer is faithful to the provided context and gives actionable steps."
    metadata: { tags: [indexes, happy-path] }

id: explain_suppressed_root_cause
description: Allowed-set mode; explaining a known alert id needs one call, a prior list is allowed but must come first.
prompt: Why is alert alr-1002 on tenant streamflix suppressed?
max_steps: 4
expect:
  tools:
    allowed: [list_active_alerts, explain_alert]
    required: [explain_alert]
    order: [[list_active_alerts, explain_alert]]
    args:
      explain_alert:
        tenantId: streamflix
        alertId: alr-1002
    optimal_calls: 1
  final_text:
    contains: [alr-1001]
script:
  - tool_calls:
      - {name: explain_alert, arguments: {tenantId: streamflix, alertId: alr-1002}}
  - content: alr-1002 is suppressed because the upstream root cause alr-1001 (error rate in us-east-1) is already firing.
